name: CI/CD
on:
  push:
    branches: [ develop, production ]
  pull_request:
    branches: [ develop, production ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Imagen ya publicada a desplegar sin compilar.'
        default: ''

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/grupo-14-ingsis/snippetsearcher-app


jobs:
  test:
    if: ${{ !input.image_tag}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {
          distribution: temurin,
            java-version: '21'}
      - uses:  gradle/actions/setup-gradle@v3
      - run: bash ./gradlew build
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: jacoco-report, path: build/reports/jacoco/test/html/ }
  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }},${{ env.IMAGE }}:${{ github.ref_name }}-${{ github.sha }}
          build-args: |
            GITHUB_USERNAME=${{ github.repository_owner }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
  # Un job por ambiente; corre el de la rama pusheada y el otro queda salteado (gris). Cada uno usa la
  # versión de deploy-stack.yml de su rama de Infra: un cambio al deploy se prueba en dev (develop) y
  # llega a prod recién cuando Infra mergea develop -> main.
  deploy-dev:
    needs: image
    if: >
      always() && github.event_name != 'pull_request' && github.ref_name == 'develop'
      && (needs.image.result == 'success' || inputs.image_tag != '')
    uses: Grupo-14-INGSIS/SnippetSearcher-Infrastructure/.github/workflows/deploy-stack.yml@develop
    with:
      stack: app
      ambiente: DEV
      image_tag: ${{ inputs.image_tag || format('develop-{0}', github.sha) }}
      nr_app: AppIngsis_dev
    secrets: inherit

  deploy-prod:
    needs: image
    if: >
      always() && github.event_name != 'pull_request' && github.ref_name == 'production'
      && (needs.image.result == 'success' || inputs.image_tag != '')
    uses: Grupo-14-INGSIS/SnippetSearcher-Infrastructure/.github/workflows/deploy-stack.yml@main
    with:
      stack: app
      ambiente: PROD
      image_tag: ${{ inputs.image_tag || format('production-{0}', github.sha) }}
      nr_app: AppIngsis
    secrets: inherit