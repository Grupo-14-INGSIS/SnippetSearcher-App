name: CI/CD

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [ develop, production ]
  pull_request:
    branches: [ develop, production ]

jobs:
  ci-cd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # ← ACTUALIZADO: v3 → v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Cache Gradle packages  # Acelera builds
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run ktlintFormat
        run: |
          CHANGES_BEFORE=$(git diff --name-only)
          ./gradlew ktlintFormat --quiet
          CHANGES_AFTER=$(git diff --name-only)
          if [ "$CHANGES_BEFORE" != "$CHANGES_AFTER" ]; then
            echo "Build bloqueado: ktlintFormat modificó archivos."
            exit 1
          fi

      - name: Run ktlintCheck
        run: ./gradlew ktlintCheck --quiet

      - name: Run Detekt
        run: ./gradlew detekt

      - name: Run tests
        run: |
          ./gradlew test --continue > .git/test-output.log
          if grep -q "FAILED" .git/test-output.log; then
            echo "Build bloqueado: fallaron tests."
            cat .git/test-output.log | grep FAILED
            exit 1
          fi

      - name: Verify coverage
        run: |
          if ! ./gradlew jacocoTestCoverageVerification --quiet; then
            echo "Build bloqueado: cobertura de código inferior al 80%."
            ./gradlew jacocoTestReport
            exit 1
          fi

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html/

      - name: Check
        run: ./gradlew check

      - name: Build
        run: ./gradlew build

#      - name: Upload test results  # Guardar resultados de tests
#        if: always()
#        uses: actions/upload-artifact@v4
#        with:
#          name: test-results
#          path: build/reports/tests/test/

      - name: Upload build artifacts  # Guardar JAR generado
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: build/libs/*.jar

  build-and-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: ci-cd
    outputs:
      image_version: ${{ steps.version.outputs.version }}
      branch: ${{ steps.version.outputs.branch }}
      infra_branch: ${{ steps.version.outputs.infra_branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Store new image version
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          
          # Las ramas no se llaman igual: este repo usa develop/production e Infra usa develop/main
          if [[ "$GITHUB_REF_NAME" == "production" ]]; then
          echo "branch=production" >> "$GITHUB_OUTPUT"
          echo "infra_branch=main" >> "$GITHUB_OUTPUT"
          else
          echo "branch=develop" >> "$GITHUB_OUTPUT"
          echo "infra_branch=develop" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/grupo-14-ingsis/snippetsearcher-app:${{ steps.version.outputs.branch }}
            ghcr.io/grupo-14-ingsis/snippetsearcher-app:${{ steps.version.outputs.version }}
          build-args: |
            GITHUB_USERNAME=${{ github.repository_owner }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}

  update-infra:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Un run de este repo a la vez por rama: si se acumulan, queda el último, que trae la versión más nueva
    concurrency:
      group: update-infra-${{ github.ref_name }}
      cancel-in-progress: false
    needs: build-and-push
    steps:
      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: Grupo-14-INGSIS/SnippetSearcher-Infrastructure
          ref: ${{ needs.build-and-push.outputs.infra_branch }}
          token: ${{ secrets.PAT }}
          path: infrastructure

      - name: Update image version
        env:
          IMAGE_VERSION: ${{ needs.build-and-push.outputs.image_version }}
          IMAGE: ghcr.io/grupo-14-ingsis/snippetsearcher-app
          BRANCH: ${{ needs.build-and-push.outputs.infra_branch }}
          COMPOSE_FILE: "docker-stack.yml"
        run: |
          set -euo pipefail

          cd infrastructure

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Varios repos pueden escribir en Infra a la vez (por ejemplo, al mergear varios PR juntos).
          # Si rechazan el push, se vuelve a aplicar la versión sobre lo último de la rama.
          for attempt in 1 2 3 4 5 6; do
            git fetch origin "$BRANCH"
            git reset --hard FETCH_HEAD

            if ! grep -Eq "^[[:space:]]*image:[[:space:]]*${IMAGE}:" "$COMPOSE_FILE"; then
              echo "ERROR: Couldn't find image $IMAGE in $COMPOSE_FILE"
              exit 1
            fi

            sed -i -E \
              "s#(^[[:space:]]*image:[[:space:]]*${IMAGE}:)[^[:space:]]+#\1${IMAGE_VERSION}#" \
              "$COMPOSE_FILE"

            if ! grep -Fq "${IMAGE}:${IMAGE_VERSION}" "$COMPOSE_FILE"; then
              echo "ERROR: Could not successfully update the version"
              exit 1
            fi

            if git diff --quiet -- "$COMPOSE_FILE"; then
              echo "Version was already updated; no changes required."
              exit 0
            fi

            git add "$COMPOSE_FILE"
            git commit -m "chore: update Docker image ${IMAGE} to ${IMAGE_VERSION}"

            if git push origin "HEAD:${BRANCH}"; then
              exit 0
            fi

            echo "Push rechazado en el intento $attempt: reintentando."
            sleep $((RANDOM % 10 + 5))
          done

          echo "ERROR: Could not push to $BRANCH after 6 attempts"
          exit 1
