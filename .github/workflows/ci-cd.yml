name: CI/CD

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [ develop, production ]
  pull_request:
    branches: [ develop, production ]

jobs:
  ci-cd-publish:
    runs-on: ubuntu-latest
    concurrency:
      group: update-infra-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # ← ACTUALIZADO: v3 → v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Cache Gradle packages  # Acelera builds
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run ktlintFormat
        run: |
          CHANGES_BEFORE=$(git diff --name-only)
          ./gradlew ktlintFormat --quiet
          CHANGES_AFTER=$(git diff --name-only)
          if [ "$CHANGES_BEFORE" != "$CHANGES_AFTER" ]; then
            echo "Build bloqueado: ktlintFormat modificó archivos."
            exit 1
          fi

      - name: Run ktlintCheck
        run: ./gradlew ktlintCheck --quiet

      - name: Run Detekt
        run: ./gradlew detekt

      - name: Run tests
        run: |
          ./gradlew test --continue > .git/test-output.log
          if grep -q "FAILED" .git/test-output.log; then
            echo "Build bloqueado: fallaron tests."
            cat .git/test-output.log | grep FAILED
            exit 1
          fi

      - name: Verify coverage
        run: |
          if ! ./gradlew jacocoTestCoverageVerification --quiet; then
            echo "Build bloqueado: cobertura de código inferior al 80%."
            ./gradlew jacocoTestReport
            exit 1
          fi

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html/

      - name: Check
        run: ./gradlew check

      - name: Build
        run: ./gradlew build

#      - name: Upload test results  # Guardar resultados de tests
#        if: always()
#        uses: actions/upload-artifact@v4
#        with:
#          name: test-results
#          path: build/reports/tests/test/

      - name: Upload build artifacts  # Guardar JAR generado
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: build/libs/*.jar

      - name: build-and-push
        id: build
        if: github.event_name == 'push'
        uses: Grupo-14-INGSIS/SnippetSearcher-ImageBuildAndDeploy/workflows/build-and-publish-docker-image@v1
        with:
          image: ghcr.io/grupo-14-ingsis/snippetsearcher-app
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update infra
        if: github.event_name == 'push'
        uses: Grupo-14-INGSIS/SnippetSearcher-ImageBuildAndDeploy/workflows/update-infra@v1
        with:
          image: ghcr.io/grupo-14-ingsis/snippetsearcher-app
          image_version: ${{ steps.build.outputs.image_version }}
          infra_branch: ${{ steps.build.outputs.infra_branch }}
          pat: ${{ secrets.PAT }}