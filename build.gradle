plugins {
    id 'buildlogic.kotlin-myPlugin-conventions'
    id 'org.jetbrains.kotlin.plugin.spring' version '2.2.0'
    id 'org.springframework.boot' version '4.0.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.jetbrains.kotlin.plugin.jpa' version '2.2.0'
    id 'application'
}

def srcHookPath = "${rootDir}/.githooks/pre-commit"
def hookFilePath = "${rootDir}/.git/hooks/pre-commit"

tasks.register("installGitHook") {
    def srcHook = file(srcHookPath)
    def hookFile = file(hookFilePath)

    outputs.file(hookFile)

    doLast {
        if (!srcHook.exists()) {
            println "No hook found in .githooks/pre-commit"
            return
        }

        hookFile.parentFile.mkdirs()
        hookFile.text = srcHook.text
        hookFile.setExecutable(true)
        println "Pre-commit was installed/updated in .git/hooks/"
    }
}

group = 'com.example'
version = '1.0-SNAPSHOT'

// Java 21, JUnit 5, ktlint, detekt y la cobertura mínima del 80 % vienen de myPlugin
// (buildSrc/.../buildlogic.kotlin-myPlugin-conventions.gradle). Acá solo lo propio de este servicio.
// No se mide cobertura de DTOs, configuración de Spring ni de la clase main:
ext.jacocoExclusions = [
        '**/dto/**',
        '**/config/**',
        '**/SnippetSearcherApp*',
]

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'tools.jackson.module:jackson-module-kotlin'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'com.newrelic.agent.java:newrelic-api:8.7.0'
    implementation 'org.springframework.boot:spring-boot-starter-logging'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'io.lettuce:lettuce-core'
    implementation 'org.apache.httpcomponents.client5:httpclient5'

    runtimeOnly 'org.postgresql:postgresql:42.7.1'

    testImplementation "org.junit.jupiter:junit-jupiter:5.9.3"
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.security:spring-security-test'
}



kotlin {
    compilerOptions {
        freeCompilerArgs.addAll '-Xjsr305=strict'
    }
}

allOpen {
    annotation 'jakarta.persistence.Entity'
    annotation 'jakarta.persistence.MappedSuperclass'
    annotation 'jakarta.persistence.Embeddable'
}

application {
    mainClass = 'com.grupo14IngSis.snippetSearcherApp.SnippetSearcherAppKt'
}

tasks.bootJar {
    mainClass.set("com.grupo14IngSis.snippetSearcherApp.SnippetSearcherAppKt")
}
