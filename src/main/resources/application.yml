spring:
  application:
    name: snippet-searcher-app
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
      dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          # Spring valida firma, iss y exp. audiences agrega aud: rechaza tokens emitidos para otra API
          issuer-uri: https://dev-65tlgyzfpbzeka8a.us.auth0.com/
          audiences: https://api.snippets.com
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
redis:
  streams:
    # App -> Runner: trabajos de linteo/formateo. Runner -> App: resultados.
    jobs: "snippet-jobs"
    results: "snippet-job-results"
    results-group: "app_group"
    # XADD con MAXLEN ~ : el stream guarda historial pero recortado
    max-length: 10000
    # Cada cuánto se reintentan los mensajes que quedaron sin ACK (réplica caída, error transitorio)
    reclaim-interval-ms: 30000
    # Reconciliador: encola el linteo de snippets que nunca tuvieron resultado
    reconcile-initial-delay-ms: 120000
    reconcile-interval-ms: 300000

app:
  accessmanager:
    url: http://${ACCESS_MANAGER_HOST}:${ACCESS_MANAGER_PORT}

runner:
  service:
    url: http://${RUNNER_HOST}:${RUNNER_PORT}

server:
  port: 8080

# Chequeo de salud público para Synthetics: /api/actuator/health (nginx solo le manda a App lo que empieza
# con /api/). Responde solo UP o DOWN, sin detalles. Incluye la base, Redis, Runner y AccessManager.
management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# La app no usa credenciales de Auth0: solo valida tokens (issuer-uri y audiences, arriba).
# El clientSecret que había acá estaba expuesto en el repo: hay que rotarlo en Auth0.


# Configuración de logs con request-id
logging:
  pattern:
    console: "[%X{request_id}] %d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  level:
    root: INFO
    com.grupo14IngSis.snippetSearcherApp: DEBUG
